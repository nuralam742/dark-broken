<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Policies — —͞Dᴀʀᴋ Bʀᴏᴋᴇɴ !i</title>
<link href="https://fonts.cdnfonts.com/css/black-mustang" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main class="wrap">
  <section class="panel wide" id="p-delivery"><h2>Delivery Policy</h2><p class="desc" id="t-delivery">Loading...</p></section>
  <section class="panel wide" id="p-refund"><h2>Refund Policy</h2><p class="desc" id="t-refund"></p></section>
  <section class="panel wide" id="p-privacy"><h2>Privacy Policy</h2><p class="desc" id="t-privacy"></p></section>
  <section class="panel wide" id="p-terms"><h2>Terms &amp; Conditions</h2><p class="desc" id="t-terms"></p></section>
  <section class="panel wide" id="p-about"><h2>About &amp; Contact</h2><p class="desc" id="t-about"></p></section>
  <p style="text-align:center"><a class="btn" href="index.html">← Shop-এ ফিরে যান</a></p>
</main>
<script src="assets/app.js"></script>
<script>
(async () => {
  const site = await renderChrome("");
  if (site.maintenance && !store.get(ATK)) return;
  $("#t-delivery").textContent = site.policyDelivery || "";
  $("#t-refund").textContent = site.policyRefund || "";
  $("#t-privacy").textContent = site.policyPrivacy || "";
  $("#t-terms").textContent = site.policyTerms || "";
  $("#t-about").textContent = site.policyAbout || "";
  if (location.hash) { const el = document.querySelector(location.hash); if (el) setTimeout(() => el.scrollIntoView({ behavior: "smooth" }), 60); }
})();
</script>
</body>
</html>

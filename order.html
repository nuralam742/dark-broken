<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order — —͞Dᴀʀᴋ Bʀᴏᴋᴇɴ !i</title>
<link href="https://fonts.cdnfonts.com/css/black-mustang" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main class="wrap">
  <section class="panel" id="orderPanel">
    <h2>Order করুন</h2>
    <p class="sub" id="oName">Loading...</p>
    <div class="kv"><span>মূল্য</span><b id="oPrice">—</b></div>
    <div class="kv" id="oDiscRow" style="display:none"><span>কুপন ছাড় (<span id="oDiscCode"></span>)</span><b id="oDisc" style="color:var(--ok)">—</b></div>
    <div class="kv total"><span>পরিশোধ করতে হবে</span><b id="oPayable">—</b></div>

    <label>কুপন কোড (যদি থাকে)</label>
    <div class="coupon-row">
      <input id="couponInput" type="text" placeholder="যেমন: WELCOME10">
      <button class="btn sm" id="applyCoupon" type="button">Apply</button>
    </div>
    <div class="msg" id="couponMsg"></div>

    <form id="orderForm">
      <label>আপনার নাম</label>
      <input id="cName" required placeholder="আপনার পুরো নাম">
      <label>মোবাইল নম্বর</label>
      <input id="cMobile" required placeholder="01XXXXXXXXX" inputmode="numeric">
      <label>পেমেন্ট মেথড — যেই মাধ্যমে টাকা পাঠাবেন</label>
      <div class="pay">
        <label><input type="radio" name="paym" value="bKash" checked><span>bKash</span></label>
        <label><input type="radio" name="paym" value="Nagad"><span>Nagad</span></label>
        <label><input type="radio" name="paym" value="Rocket"><span>Rocket</span></label>
      </div>
      <p class="sub" style="margin-top:12px">এই নম্বরে টাকা Send Money করুন:</p>
      <div class="paynum"><span class="n" id="payNum">—</span><button class="btn sm ghost copybtn" type="button" id="copyNum">Copy</button></div>
      <p class="sub" id="payNote" style="margin-top:8px"></p>
      <label>যে নম্বর থেকে টাকা পাঠিয়েছেন</label>
      <input id="payNumber" required placeholder="01XXXXXXXXX" inputmode="numeric">
      <label>Transaction ID (TrxID)</label>
      <input id="trxId" required placeholder="যেমন: 9HX7K2LMNP">
      <button class="btn" style="width:100%;margin-top:18px" type="submit">Order Confirm করুন</button>
      <div class="msg" id="orderMsg"></div>
    </form>
  </section>
  <section class="panel" id="donePanel" style="display:none;text-align:center">
    <div style="font-size:52px">✓</div>
    <h2>Order সফল হয়েছে!</h2>
    <p class="sub" style="margin:8px 0 18px">Order ID: <b id="doneId"></b> — পেমেন্ট যাচাইয়ের পর ডেলিভারি আপনার Dashboard-এ পৌঁছে যাবে।</p>
    <a class="btn" href="dashboard.html">My Dashboard-এ যান</a>
    <a class="btn ghost" href="index.html">আরও কিনুন</a>
  </section>
</main>
<script src="assets/app.js"></script>
<script>
const qs = new URLSearchParams(location.search);
const id = Number(qs.get("id")), variantId = Number(qs.get("variant")) || null;
let product = null, selVariant = null, price = 0, discount = 0, appliedCoupon = "", SITE2 = {};
(async () => {
  const site = await renderChrome("shop");
  SITE2 = site || {};
  if (site.maintenance && !store.get(ATK)) return;
  if (!store.get(TK)) { location.href = "login.html?next=" + encodeURIComponent("order.html?id=" + id + (variantId ? "&variant=" + variantId : "")); return; }
  if (!id) { location.href = "index.html"; return; }
  $("#payNote").textContent = site.payNote || "";
  updatePayNum();
  try {
    const d = await api("products");
    product = (d.products || []).find((x) => x.id === id);
    if (!product) throw new Error("এই প্রোডাক্টটি আর নেই");
    if (variantId && product.variants) selVariant = product.variants.find((v) => v.id === variantId) || null;
    price = selVariant ? selVariant.price : product.price;
    $("#oName").textContent = product.name + (selVariant ? " — " + selVariant.label : "");
    $("#oPrice").textContent = money(price);
    updatePayable();
    try { const me = await api("me"); $("#cName").value = me.user.name || ""; $("#cMobile").value = me.user.mobile || ""; } catch (e) {}
  } catch (e) { $("#oName").textContent = e.message; }
})();
function updatePayNum() {
  const m = document.querySelector('input[name="paym"]:checked');
  const map = { bKash: SITE2.payBkash, Nagad: SITE2.payNagad, Rocket: SITE2.payRocket };
  $("#payNum").textContent = (m && map[m.value]) || "Admin এখনো নম্বর দেয়নি — WhatsApp-এ জেনে নিন";
}
document.querySelectorAll('input[name="paym"]').forEach((r) => r.addEventListener("change", updatePayNum));
$("#copyNum").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText($("#payNum").textContent.trim()); $("#copyNum").textContent = "Copied"; setTimeout(() => $("#copyNum").textContent = "Copy", 1500); } catch (e) {}
});
function updatePayable() {
  $("#oPayable").textContent = money(price - discount);
  $("#oDiscRow").style.display = discount > 0 ? "flex" : "none";
  if (discount > 0) { $("#oDisc").textContent = "−" + money(discount); $("#oDiscCode").textContent = appliedCoupon; }
}
$("#applyCoupon").addEventListener("click", async () => {
  const code = $("#couponInput").value.trim();
  const m = $("#couponMsg");
  if (!code) { m.className = "msg err"; m.textContent = "আগে কুপন কোড লিখুন"; return; }
  try {
    const d = await api("coupons/validate?code=" + encodeURIComponent(code) + "&price=" + price);
    discount = d.discount; appliedCoupon = d.code;
    m.className = "msg ok"; m.textContent = "✓ কুপন প্রয়োগ হয়েছে — ছাড় " + money(d.discount);
    updatePayable();
  } catch (e) { discount = 0; appliedCoupon = ""; m.className = "msg err"; m.textContent = e.message; updatePayable(); }
});
$("#orderForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const m = $("#orderMsg"); m.className = "msg"; m.textContent = "Order পাঠানো হচ্ছে...";
  try {
    const d = await api("orders", { method: "POST", body: JSON.stringify({
      productId: product.id, variantId: selVariant ? selVariant.id : null,
      customerName: $("#cName").value.trim(), customerMobile: $("#cMobile").value.trim(),
      paymentMethod: document.querySelector('input[name="paym"]:checked').value,
      paymentNumber: $("#payNumber").value.trim(), trxId: $("#trxId").value.trim(), couponCode: appliedCoupon,
    })});
    $("#doneId").textContent = "#" + d.orderId;
    $("#orderPanel").style.display = "none"; $("#donePanel").style.display = "block";
    window.scrollTo({ top: 0, behavior: "smooth" });
  } catch (e) { m.className = "msg err"; m.textContent = e.message; }
});
</script>
</body>
</html>

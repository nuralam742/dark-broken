<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dashboard — —͞Dᴀʀᴋ Bʀᴏᴋᴇɴ !i</title>
<link href="https://fonts.cdnfonts.com/css/black-mustang" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main class="wrap">
  <section class="panel wide">
    <div class="profile-head">
      <div class="avatar" id="avatar">?</div>
      <div>
        <h2 id="pName">Loading...</h2>
        <p class="sub" id="pMeta"></p>
      </div>
      <button class="btn ghost sm" id="logoutBtn" style="margin-left:auto">Logout</button>
    </div>
    <div class="stats">
      <div class="stat"><div class="n" id="sTotal">0</div><div class="t">মোট Order</div></div>
      <div class="stat"><div class="n" id="sDelivered">0</div><div class="t">Completed</div></div>
      <div class="stat"><div class="n" id="sPending">0</div><div class="t">Processing</div></div>
      <div class="stat"><div class="n" id="sSpent">৳0</div><div class="t">মোট কেনাকাটা</div></div>
    </div>
    <p class="sub" id="deliveryMsg" style="margin-top:8px"></p>
  </section>

  <div class="dash-tabs" style="max-width:860px;margin-left:auto;margin-right:auto">
    <button data-tab="orders" class="on" type="button">My Orders</button>
    <button data-tab="deliveries" type="button">My Deliveries</button>
    <button data-tab="settings" type="button">Account Settings</button>
  </div>

  <section class="panel wide" id="tab-orders"><h2>আমার অর্ডারসমূহ</h2><div id="ordersWrap"></div></section>

  <section class="panel wide" id="tab-deliveries" style="display:none">
    <h2>আমার ডেলিভারি (লাইসেন্স / লিংক)</h2>
    <p class="sub">ডেলিভারি পাওয়া প্রোডাক্টের কী/লিংক এখানে থাকবে — যেকোনো সময় এসে কপি করে নিতে পারবেন।</p>
    <div id="delivWrap" style="margin-top:14px"></div>
  </section>

  <section class="panel wide" id="tab-settings" style="display:none">
    <h2>অ্যাকাউন্ট সেটিংস</h2>
    <form id="nameForm">
      <label>আপনার নাম</label>
      <input id="setName" required>
      <button class="btn sm" style="margin-top:12px" type="submit">নাম সেভ করুন</button>
      <div class="msg" id="nameMsg"></div>
    </form>
    <form id="passForm" style="margin-top:22px">
      <h3 style="font-size:16px">পাসওয়ার্ড বদলান</h3>
      <label>বর্তমান পাসওয়ার্ড</label>
      <input id="oldPass" type="password" required>
      <label>নতুন পাসওয়ার্ড</label>
      <input id="newPass" type="password" required>
      <button class="btn sm" style="margin-top:12px" type="submit">পাসওয়ার্ড বদলান</button>
      <div class="msg" id="passMsg"></div>
    </form>
  </section>
</main>
<script src="assets/app.js"></script>
<script>
let ordersCache = [];
(async () => {
  const site = await renderChrome("dashboard");
  if (site.maintenance && !store.get(ATK)) return;
  if (site.deliveryMessage) $("#deliveryMsg").textContent = site.deliveryMessage;
  if (!store.get(TK)) { location.href = "login.html?next=dashboard.html"; return; }
  try {
    const me = await api("me");
    $("#avatar").textContent = (me.user.name || "?").trim().charAt(0).toUpperCase();
    $("#pName").textContent = me.user.name;
    $("#setName").value = me.user.name;
    $("#pMeta").textContent = "" + me.user.mobile + " · সদস্য: " + (me.user.created_at || "").slice(0, 10);
  } catch (e) { store.del(TK); location.href = "login.html?next=dashboard.html"; return; }
  await loadOrders();
})();
document.querySelectorAll(".dash-tabs button").forEach((b) => b.addEventListener("click", () => {
  document.querySelectorAll(".dash-tabs button").forEach((x) => x.classList.remove("on"));
  b.classList.add("on");
  ["orders", "deliveries", "settings"].forEach((t) => $("#tab-" + t).style.display = t === b.dataset.tab ? "block" : "none");
}));
$("#logoutBtn").addEventListener("click", () => { store.del(TK); location.href = "index.html"; });
function stepHtml(o) {
  const stages = ["Pending", "Confirmed", "Delivered"];
  if (o.status === "Cancelled") return '<p style="color:var(--bad);font-size:13px;margin-top:8px">❌ এই অর্ডারটি Cancel করা হয়েছে</p>';
  const idx = stages.indexOf(o.status);
  return `<div class="steps">${stages.map((s, i) => `<div class="step ${i < idx ? "done" : ""} ${i === idx ? (o.status === "Delivered" ? "done" : "now") : ""}">${s === "Pending" ? "অর্ডার হয়েছে" : s === "Confirmed" ? "কনফার্ম" : "ডেলিভারি"}</div>`).join("")}</div>`;
}
async function loadOrders() {
  try {
    const d = await api("my/orders");
    ordersCache = d.orders || [];
    $("#sTotal").textContent = ordersCache.length;
    $("#sDelivered").textContent = ordersCache.filter((o) => o.status === "Delivered").length;
    $("#sPending").textContent = ordersCache.filter((o) => o.status === "Pending").length;
    $("#sSpent").textContent = money(ordersCache.filter((o) => o.status !== "Cancelled").reduce((s, o) => s + (o.price - (o.discount || 0)), 0));
    $("#ordersWrap").innerHTML = ordersCache.length ? `
      <table><tr><th>Order ID</th><th>প্রোডাক্ট</th><th>দাম</th><th>স্ট্যাটাস</th><th>License Key / Download</th></tr>
      ${ordersCache.map((o) => `<tr>
        <td>#${o.id}<br><span class="sub">${esc((o.created_at || "").slice(0, 10))}</span></td>
        <td><b>${esc(o.product_name)}</b>${o.variant_label ? `<br><span class="sub">${esc(o.variant_label)}</span>` : ""}<br><span class="sub">${esc(o.payment_method)}${o.discount ? ` · 🎟️ ${esc(o.coupon_code)}` : ""}</span></td>
        <td>${money(o.price - (o.discount || 0))}${o.discount ? `<br><s class="sub">${money(o.price)}</s>` : ""}</td>
        <td><span class="badge ${esc(o.status)}">${statusLabel(o.status)}</span></td>
        <td>${o.delivery_content ? `<div class="keybox"><span>${esc(o.delivery_content)}</span><button class="btn sm ghost" type="button" onclick="copyKey(this)">Copy</button></div>` : '<span class="sub">প্রসেসিং চলছে</span>'}</td>
      </tr>`).join("")}
      </table>` : '<div class="empty">এখনো কোনো অর্ডার নেই। <a href="index.html">Shop থেকে কিনুন →</a></div>';
    const delivered = ordersCache.filter((o) => o.delivery_content);
    $("#delivWrap").innerHTML = delivered.length ? delivered.map((o) => `
      <div style="margin-bottom:16px">
        <b>${esc(o.product_name)}</b>${o.variant_label ? ` <span class="sub">(${esc(o.variant_label)})</span>` : ""} <span class="sub">· Order #${o.id}</span>
        <div class="keybox" style="margin-top:7px"><span>${esc(o.delivery_content)}</span><button class="btn sm ghost" type="button" onclick="copyKey(this)">Copy</button></div>
      </div>`).join("") : '<div class="empty">এখনো কোনো ডেলিভারি আসেনি। পেমেন্ট কনফার্ম হলে এখানে পেয়ে যাবেন।</div>';
  } catch (e) { $("#ordersWrap").innerHTML = '<div class="empty">' + esc(e.message) + "</div>"; }
}
window.copyKey = async (btn) => {
  const text = btn.parentElement.querySelector("span").textContent;
  try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; setTimeout(() => btn.textContent = "Copy", 1500); } catch (e) {}
};
$("#nameForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const m = $("#nameMsg");
  try { await api("me", { method: "PATCH", body: JSON.stringify({ name: $("#setName").value.trim() }) }); m.className = "msg ok"; m.textContent = "✓ নাম সেভ হয়েছে"; $("#pName").textContent = $("#setName").value.trim(); }
  catch (e) { m.className = "msg err"; m.textContent = e.message; }
});
$("#passForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const m = $("#passMsg");
  try { await api("me/password", { method: "POST", body: JSON.stringify({ oldPassword: $("#oldPass").value, newPassword: $("#newPass").value }) }); m.className = "msg ok"; m.textContent = "✓ পাসওয়ার্ড বদলে গেছে"; $("#passForm").reset(); }
  catch (e) { m.className = "msg err"; m.textContent = e.message; }
});
</script>
</body>
</html>

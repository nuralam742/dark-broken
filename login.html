<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — —͞Dᴀʀᴋ Bʀᴏᴋᴇɴ !i</title>
<link href="https://fonts.cdnfonts.com/css/black-mustang" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main class="wrap">
  <section class="panel">
    <h2 id="authTitle">Login করুন</h2>
    <p class="sub">আপনার Dashboard, অর্ডার আর ডেলিভারি দেখতে Login করুন।</p>
    <div class="switch">
      <button id="tabLogin" class="on" type="button">Login</button>
      <button id="tabReg" type="button">Register</button>
    </div>
    <form id="authForm">
      <div id="nameField" style="display:none">
        <label>আপনার নাম</label>
        <input id="aName" placeholder="আপনার নাম">
      </div>
      <div id="emailField" style="display:none">
        <label>ইমেইল (ঐচ্ছিক — দিলে ইমেইল দিয়েও Login করতে পারবেন)</label>
        <input id="aEmailReg" type="email" placeholder="you@example.com">
      </div>
      <div id="mobileField">
        <label id="idLabel">মোবাইল নম্বর</label>
        <input id="aMobile" required placeholder="01XXXXXXXXX" inputmode="numeric">
      </div>
      <label>পাসওয়ার্ড</label>
      <input id="aPass" type="password" required placeholder="পাসওয়ার্ড">
      <button class="btn" style="width:100%;margin-top:18px" type="submit" id="authBtn">Login</button>
      <button class="btn ghost" style="width:100%;margin-top:10px" type="button" id="emailToggle">✉️ Continue with Email</button>
      <div class="msg" id="authMsg"></div>
    </form>
  </section>
</main>
<script src="assets/app.js"></script>
<script>
(async () => { const site = await renderChrome("login"); if (site.maintenance && !store.get(ATK)) return; })();
if (store.get(TK)) location.href = "dashboard.html";
const next = new URLSearchParams(location.search).get("next") || "dashboard.html";
let mode = "login", loginVia = "mobile";
function setMode(m) {
  mode = m;
  $("#tabLogin").classList.toggle("on", m === "login");
  $("#tabReg").classList.toggle("on", m === "register");
  $("#nameField").style.display = m === "register" ? "block" : "none";
  $("#emailField").style.display = m === "register" ? "block" : "none";
  $("#emailToggle").style.display = m === "login" ? "block" : "none";
  $("#authTitle").textContent = m === "register" ? "নতুন অ্যাকাউন্ট খুলুন" : "Login করুন";
  $("#authBtn").textContent = m === "register" ? "Register" : "Login";
  if (m === "register") setVia("mobile");
}
function setVia(v) {
  loginVia = v;
  const inp = $("#aMobile");
  if (v === "email") {
    $("#idLabel").textContent = "ইমেইল ঠিকানা";
    inp.placeholder = "you@example.com"; inp.removeAttribute("inputmode"); inp.type = "email";
    $("#emailToggle").textContent = "📱 Continue with Mobile";
  } else {
    $("#idLabel").textContent = "মোবাইল নম্বর";
    inp.placeholder = "01XXXXXXXXX"; inp.setAttribute("inputmode", "numeric"); inp.type = "text";
    $("#emailToggle").textContent = "✉️ Continue with Email";
  }
}
$("#emailToggle").addEventListener("click", () => setVia(loginVia === "mobile" ? "email" : "mobile"));
$("#tabLogin").addEventListener("click", () => setMode("login"));
$("#tabReg").addEventListener("click", () => setMode("register"));
$("#authForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const m = $("#authMsg"); m.className = "msg"; m.textContent = "অপেক্ষা করুন...";
  try {
    const payload = mode === "register"
      ? { name: $("#aName").value.trim(), mobile: $("#aMobile").value.trim(), email: $("#aEmailReg").value.trim(), password: $("#aPass").value }
      : { identifier: $("#aMobile").value.trim(), password: $("#aPass").value };
    const d = await api(mode === "register" ? "auth/register" : "auth/login", { method: "POST", body: JSON.stringify(payload) });
    store.set(TK, d.token);
    location.href = next;
  } catch (e) { m.className = "msg err"; m.textContent = e.message; }
});
</script>
</body>
</html>

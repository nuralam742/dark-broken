<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — —͞Dᴀʀᴋ Bʀᴏᴋᴇɴ !i</title>
<link href="https://fonts.cdnfonts.com/css/black-mustang" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main class="wrap">
  <div class="crumb"><a href="index.html">Shop</a> / <span id="crumbName">Product</span></div>
  <div id="detail" class="detail"></div>
  <div id="notfound" class="empty" style="display:none">এই প্রোডাক্টটি পাওয়া যায়নি। <a href="index.html">Shop-এ ফিরে যান</a></div>
</main>
<script src="assets/app.js"></script>
<script>
const id = Number(new URLSearchParams(location.search).get("id"));
let selVariant = null, prod = null;
(async () => {
  const site = await renderChrome("shop");
  if (site.maintenance && !store.get(ATK)) return;
  if (!id) { $("#notfound").style.display = "block"; return; }
  try {
    const d = await api("products");
    prod = (d.products || []).find((x) => x.id === id);
    if (!prod) { $("#notfound").style.display = "block"; return; }
    document.title = prod.name + " — —͞Dᴀʀᴋ Bʀᴏᴋᴇɴ !i";
    $("#crumbName").textContent = prod.name;
    drawDetail();
  } catch (e) { $("#notfound").style.display = "block"; $("#notfound").textContent = e.message; }
})();
function curPrice() { return selVariant ? selVariant.price : prod.price; }
function curOld() { return selVariant ? selVariant.old_price : prod.old_price; }
function drawDetail() {
  const p = prod;
  const hasVar = p.variants && p.variants.length;
  const st = stockTotal(p);
  $("#detail").innerHTML = `
    <div class="imgbox">${productImg(p)}</div>
    <div>
      ${p.category ? `<div class="cat">${esc(p.category)}</div>` : ""}
      <h1 style="font-size:28px;margin:6px 0">${esc(p.name)}</h1>
      <div class="price" style="font-size:26px" id="priceBox"></div>
      ${hasVar ? `<label>ভার্সন / প্যাকেজ বেছে নিন</label><div class="variant-btns" id="varBtns">
        ${p.variants.map((v, i) => `<button type="button" data-i="${i}">${esc(v.label)}<b>${money(v.price)}${v.old_price ? ` <s style="color:var(--muted);font-size:12px">${money(v.old_price)}</s>` : ""}</b></button>`).join("")}
      </div>` : ""}
      <p class="desc">${esc(p.description || "কোনো বিবরণ দেওয়া হয়নি।")}</p>
      <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">
        <a class="btn" id="orderBtn" href="#">Order Now</a>
        <a class="btn ghost" href="index.html">← আরও প্রোডাক্ট</a>
      </div>
      <div class="panel" style="margin:22px 0 0;max-width:none;padding:16px 18px">
        <div class="kv"><span>স্টক</span><b>${st ? "আছে (" + st + "টি)" : "অর্ডার করা যাবে — ডেলিভারি কনফার্মে"}</b></div>
        <div class="kv"><span>পেমেন্ট</span><b>bKash / Nagad / Rocket</b></div>
        <div class="kv" style="border-bottom:none"><span>ডেলিভারি</span><b>আপনার Dashboard-এ সরাসরি</b></div>
      </div>
    </div>`;
  const upd = () => {
    $("#priceBox").innerHTML = `${money(curPrice())}${curOld() ? `<s>${money(curOld())}</s>` : ""}${offPct(curPrice(), curOld()) ? `<span class="off">-${offPct(curPrice(), curOld())}% OFF</span>` : ""}`;
    $("#orderBtn").href = "order.html?id=" + p.id + (selVariant ? "&variant=" + selVariant.id : "");
    document.querySelectorAll("#varBtns button").forEach((b, i) => b.classList.toggle("on", hasVar && selVariant === p.variants[i]));
  };
  if (hasVar) {
    selVariant = p.variants[0];
    document.querySelectorAll("#varBtns button").forEach((b) => b.addEventListener("click", () => { selVariant = p.variants[Number(b.dataset.i)]; upd(); }));
  }
  upd();
}
</script>
</body>
</html>
